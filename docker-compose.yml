services:
  postgres:
    image: postgres:17-alpine
    container_name: logiflow-tracking-postgres
    environment:
      POSTGRES_DB: logiflow_tracking
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: logiflow123
    ports:
      - "5435:5432"
    volumes:
      - tracking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiflow -d logiflow_tracking"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: logiflow-tracking-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: logiflow-tracking-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: logiflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  tracking-service:
    build:
      context: ./tracking-service
    container_name: logiflow-tracking-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/logiflow_tracking
      DB_USERNAME: logiflow
      DB_PASSWORD: logiflow123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8090
    ports:
      - "8090:8090"

volumes:
  tracking_postgres_data:
